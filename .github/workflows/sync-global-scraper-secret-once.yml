name: Sync global scraper secret once

on:
  pull_request:
    paths:
      - ".github/workflows/sync-global-scraper-secret-once.yml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-global-scraper-secret-once.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate one-shot secret sync
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enforce one-secret scope
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/sync-global-scraper-secret-once.yml").read_text()
          required = (
              'permissions:\n  contents: read',
              '"GLOBAL_SCRAPER_SECRET=$GLOBAL_SCRAPER_SECRET"',
              'scripts/run_global_event_discovery.py status',
          )
          runtime = workflow.split("\n  sync:\n", 1)[1]
          forbidden = (
              "SUPABASE_DB_PASSWORD",
              "SUPABASE_SERVICE_ROLE_KEY",
              "set -x",
              "secrets list",
          )
          assert all(item in workflow for item in required)
          assert not any(item in runtime for item in forbidden)
          PY

  sync:
    name: Sync and verify discovery authentication
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: one-shot-global-scraper-secret-sync
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate protected inputs
        env:
          GLOBAL_SCRAPER_SECRET: ${{ secrets.GLOBAL_SCRAPER_SECRET }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          test "${#GLOBAL_SCRAPER_SECRET}" -ge 32 || { echo "GLOBAL_SCRAPER_SECRET must contain at least 32 characters" >&2; exit 1; }
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "SUPABASE_ACCESS_TOKEN is required" >&2; exit 1; }
          test -n "$SUPABASE_PROJECT_ID" || { echo "SUPABASE_PROJECT_ID is required" >&2; exit 1; }
          test -n "$SUPABASE_URL" || { echo "SUPABASE_URL is required" >&2; exit 1; }

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Sync only the worldwide discovery secret
        env:
          GLOBAL_SCRAPER_SECRET: ${{ secrets.GLOBAL_SCRAPER_SECRET }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: >-
          supabase secrets set
          --project-ref "$SUPABASE_PROJECT_ID"
          "GLOBAL_SCRAPER_SECRET=$GLOBAL_SCRAPER_SECRET"

      - name: Verify GitHub-to-Edge authentication
        env:
          GLOBAL_SCRAPER_SECRET: ${{ secrets.GLOBAL_SCRAPER_SECRET }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          TZ: Europe/Zurich
        run: >-
          python3 scripts/run_global_event_discovery.py status
          --no-state --timeout 30 --retries 2
