name: Fix obsolete POI list rewrite

on:
  push:
    branches: [refactor/map-source-parity]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/map-source-parity
      - name: Patch obsolete POI rewrites
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'scripts/apply-poi-map-layer.mjs';
          let source = fs.readFileSync(path, 'utf8');
          const before = '["combined visible total", "combined loaded count"].includes(label)';
          const after = '[\n      "combined visible total",\n      "combined loaded count",\n      "place result list integration",\n    ].includes(label)';
          if (!source.includes(before) && !source.includes(after)) {
            throw new Error('Expected obsolete POI rewrite allowlist was not found');
          }
          source = source.replace(before, after);
          fs.writeFileSync(path, source);
          NODE
          node --check scripts/apply-poi-map-layer.mjs
      - name: Commit correction
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/apply-poi-map-layer.mjs
          git commit -m 'fix(ci): skip obsolete POI result list rewrite'
          git push origin HEAD:refactor/map-source-parity
