name: Materialize direct OpenFreeMap loading

on:
  push:
    branches: [fix/openfreemap-direct-loading]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-openfreemap-direct
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/openfreemap-direct-loading
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Make OpenFreeMap browser-direct
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const proxyPath = 'src/lib/map-asset-proxy.ts';
          let proxy = fs.readFileSync(proxyPath, 'utf8');
          proxy = proxy.replace(
            'const DIRECT_MAP_ASSET_HOSTS = new Set(["tile.openstreetmap.org"]);',
            'const DIRECT_MAP_ASSET_HOSTS = new Set(["tiles.openfreemap.org", "tile.openstreetmap.org"]);',
          );
          proxy = proxy.replace(
            /\/\*\*[\s\S]*?\*\/\nexport function mapAssetProxyUrl/,
            `/**\n * Validates known public map hosts while loading both OpenFreeMap and the OSM\n * raster fallback directly in the browser. Keeping these assets off the Worker\n * removes proxy DNS and timeout failures from the critical rendering path.\n */\nexport function mapAssetProxyUrl`,
          );
          fs.writeFileSync(proxyPath, proxy);

          const routingPath = 'tests/map-asset-routing.test.ts';
          let routing = fs.readFileSync(routingPath, 'utf8');
          routing = routing.replace(
            'test("OpenFreeMap assets continue through the same-origin cache", () => {',
            'test("OpenFreeMap assets bypass the Worker proxy", () => {',
          );
          routing = routing.replace(
            '  assert.equal(mapAssetProxyUrl(glyph), `/api/map-assets?url=${encodeURIComponent(glyph)}`);',
            '  assert.equal(mapAssetProxyUrl(glyph), null);',
          );
          fs.writeFileSync(routingPath, routing);

          const loadingPath = 'tests/map-loading.test.ts';
          let loading = fs.readFileSync(loadingPath, 'utf8');
          loading = loading.replace(
            'test("map assets are strictly allowlisted and rewritten to the application origin", () => {',
            'test("map assets are strictly allowlisted and loaded directly from trusted hosts", () => {',
          );
          loading = loading.replace(
            '  assert.equal(mapAssetProxyUrl(tile), `/api/map-assets?url=${encodeURIComponent(tile)}`);',
            '  assert.equal(mapAssetProxyUrl(tile), null);',
          );
          fs.writeFileSync(loadingPath, loading);
          NODE
      - name: Format and validate
        run: |
          npx prettier --write src/lib/map-asset-proxy.ts tests/map-asset-routing.test.ts tests/map-loading.test.ts
          node --test tests/map-asset-routing.test.ts tests/map-loading.test.ts
      - name: Commit direct loading
        run: |
          rm .github/workflows/materialize-openfreemap-direct.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/map-asset-proxy.ts tests/map-asset-routing.test.ts tests/map-loading.test.ts .github/workflows/materialize-openfreemap-direct.yml
          git commit -m 'fix(map): load OpenFreeMap directly'
          git push origin HEAD:fix/openfreemap-direct-loading
