name: Performance and responsive quality gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: performance-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Auto-format La Decadanse changes
        if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
        run: |
          bunx prettier --write \
            src/components/venue-event-list.tsx \
            src/lib/venue-detail.ts \
            'src/routes/venue.$slug.tsx' \
            supabase/functions/_shared/ladecadanse-adapter.test.ts \
            supabase/functions/_shared/ladecadanse-adapter.ts \
            supabase/functions/ladecadanse-sync/index.ts
          bunx eslint --fix \
            src/components/venue-event-list.tsx \
            src/lib/venue-detail.ts \
            'src/routes/venue.$slug.tsx' \
            supabase/functions/_shared/ladecadanse-adapter.test.ts \
            supabase/functions/_shared/ladecadanse-adapter.ts \
            supabase/functions/ladecadanse-sync/index.ts
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              src/components/venue-event-list.tsx \
              src/lib/venue-detail.ts \
              'src/routes/venue.$slug.tsx' \
              supabase/functions/_shared/ladecadanse-adapter.test.ts \
              supabase/functions/_shared/ladecadanse-adapter.ts \
              supabase/functions/ladecadanse-sync/index.ts
            git commit -m "style: format La Decadanse venue catalog"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: ESLint
        run: bun run lint

      - name: TypeScript
        run: bun run typecheck

      - name: Recovered routes and application shell
        run: bun run check:routes

      - name: Existing automated tests
        run: |
          bun run test:map
          bun run test:mcp
          bun run test:i18n
          bun run test:translations
          bun run test:performance

      - name: Production build
        run: bun run build

      - name: Bundle budget
        run: bun run check:bundle

      - name: Vercel production build
        run: |
          bun run build:vercel
          test -f .vercel/output/config.json
          test -f .vercel/output/functions/__server.func/index.mjs
