name: Performance and responsive quality gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: ESLint
        run: bun run lint

      - name: TypeScript
        run: bun run typecheck

      - name: Recovered routes and application shell
        run: bun run check:routes

      - name: Existing automated tests
        run: |
          bun run test:map
          bun run test:mcp
          bun run test:i18n
          bun run test:translations
          bun run test:performance

      - name: Production build
        run: bun run build

      - name: Bundle budget
        run: bun run check:bundle

      - name: Vercel production build
        run: |
          bun run build:vercel
          test -f .vercel/output/config.json
          test -f .vercel/output/functions/__server.func/index.mjs
