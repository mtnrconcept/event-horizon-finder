name: Format La Decadanse PR

on:
  push:
    branches:
      - feat/ladecadanse-complete-venue-catalog

permissions:
  contents: write

concurrency:
  group: format-ladecadanse-pr
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/ladecadanse-complete-venue-catalog
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format and repair lint
        run: |
          bunx prettier --write \
            src/components/venue-event-list.tsx \
            src/lib/venue-detail.ts \
            'src/routes/venue.$slug.tsx' \
            supabase/functions/_shared/ladecadanse-adapter.test.ts \
            supabase/functions/_shared/ladecadanse-adapter.ts \
            supabase/functions/ladecadanse-sync/index.ts
          bunx eslint --fix \
            src/components/venue-event-list.tsx \
            src/lib/venue-detail.ts \
            'src/routes/venue.$slug.tsx' \
            supabase/functions/_shared/ladecadanse-adapter.test.ts \
            supabase/functions/_shared/ladecadanse-adapter.ts \
            supabase/functions/ladecadanse-sync/index.ts

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/venue-event-list.tsx \
            src/lib/venue-detail.ts \
            'src/routes/venue.$slug.tsx' \
            supabase/functions/_shared/ladecadanse-adapter.test.ts \
            supabase/functions/_shared/ladecadanse-adapter.ts \
            supabase/functions/ladecadanse-sync/index.ts
          git commit -m "style: format La Decadanse venue catalog"
          git push origin HEAD:feat/ladecadanse-complete-venue-catalog
