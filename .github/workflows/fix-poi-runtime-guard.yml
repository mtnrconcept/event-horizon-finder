name: Fix POI runtime guard

on:
  push:
    branches: [refactor/map-source-parity]
    paths:
      - .github/workflows/fix-poi-runtime-guard.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/map-source-parity
          fetch-depth: 0

      - name: Relax committed POI runtime detection
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'scripts/apply-poi-map-layer.mjs';
          let source = fs.readFileSync(path, 'utf8');
          const before = `const committedPoiRuntimeMarkers = [
            "usePlaceMapDiscovery",
            "usePlaceMapLayer",
            "PlaceSearchResults",
            "PlaceDetailDialog",
            "placeDiscovery.pinBatch",
          ];`;
          const after = `const committedPoiRuntimeMarkers = [
            "usePlaceMapDiscovery",
            "usePlaceMapLayer",
            "PlaceSearchResults",
            "PlaceDetailDialog",
          ];`;
          if (source.includes(after)) {
            console.log('POI runtime guard is already corrected.');
          } else if (source.includes(before)) {
            source = source.replace(before, after);
            fs.writeFileSync(path, source);
          } else {
            throw new Error('Expected committedPoiRuntimeMarkers block was not found');
          }
          NODE
          node --check scripts/apply-poi-map-layer.mjs

      - name: Commit correction
        run: |
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/apply-poi-map-layer.mjs
          git commit -m 'fix(ci): detect committed POI runtime structurally'
          git push origin HEAD:refactor/map-source-parity
