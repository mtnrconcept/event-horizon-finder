name: Apply map pan and zoom freeze hotfix

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-map-pan-zoom-freeze-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || 'fix/map-pan-zoom-freeze' }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply deterministic hotfix
        run: node scripts/apply-map-pan-zoom-freeze.mjs

      - name: Format and validate focused changes
        run: |
          bunx prettier --write \
            src/routes/map.tsx \
            src/hooks/usePlaceMapLayer.ts \
            tests/map-interaction-performance.test.ts \
            package.json
          bunx eslint \
            src/routes/map.tsx \
            src/hooks/usePlaceMapLayer.ts \
            tests/map-interaction-performance.test.ts
          bun run test:map
          bun run build
          bun run typecheck

      - name: Commit final hotfix
        run: |
          rm scripts/apply-map-pan-zoom-freeze.mjs
          rm .github/workflows/apply-map-pan-zoom-freeze.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(map): keep pan and zoom interactions responsive"
          git push origin HEAD:${{ github.head_ref }}
