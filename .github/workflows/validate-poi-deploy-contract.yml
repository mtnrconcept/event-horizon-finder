name: Validate POI deploy contract

on:
  pull_request:
    paths:
      - ".github/workflows/deploy-production.yml"
      - "src/routes/map.tsx"
      - "tests/deploy-poi-runtime-contract.test.ts"
      - "tests/poi-map-layer.test.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: node --test tests/deploy-poi-runtime-contract.test.ts tests/poi-map-layer.test.ts
