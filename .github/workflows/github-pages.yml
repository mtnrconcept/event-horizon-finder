name: GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITHUB_PAGES: "true"
  GITHUB_PAGES_BASE_PATH: /event-horizon-finder/
  VITE_SERVER_ORIGIN: https://event-horizon-finder.vercel.app

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format deployment sources once
        if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
        run: |
          bunx prettier --write \
            scripts/apply-map-mobile-performance-and-poi-filters.mjs \
            scripts/prepare-github-pages-source.mjs \
            scripts/prepare-github-pages-service-worker.mjs \
            scripts/prepare-github-pages-output.mjs \
            supabase/functions/global-place-discovery/index.ts
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/apply-map-mobile-performance-and-poi-filters.mjs \
            scripts/prepare-github-pages-source.mjs \
            scripts/prepare-github-pages-service-worker.mjs \
            scripts/prepare-github-pages-output.mjs \
            supabase/functions/global-place-discovery/index.ts
          git commit -m "style: format GitHub Pages deployment"
          git push origin HEAD:${{ github.head_ref }}

      - name: Validate deployment contracts
        run: node --test tests/github-pages-deployment.test.ts

      - name: Apply production feature patches
        run: |
          node scripts/apply-progressive-basemap.mjs
          node scripts/apply-today-default-fullscreen-intro.mjs
          node scripts/apply-map-mobile-performance-and-poi-filters.mjs
          node scripts/apply-poi-map-layer.mjs

      - name: Prepare GitHub Pages source
        run: |
          node scripts/prepare-github-pages-source.mjs
          node scripts/prepare-github-pages-service-worker.mjs

      - name: Format generated source
        run: |
          bunx prettier --write \
            vite.config.ts \
            src/router.tsx \
            src/lib/deployment-paths.ts \
            src/lib/monetization.ts \
            src/lib/ad-queries.ts \
            src/integrations/supabase/client.ts \
            src/routes/__root.tsx \
            src/routes/auth.tsx \
            src/components/pwa-runtime.tsx \
            src/components/brand/brand-logo.tsx \
            src/components/brand/brand-arrival.tsx \
            src/components/brand/brand-arrival.css \
            public/sw.js

      - name: Run complete quality gate
        run: bun run check

      - name: Prepare Pages artifact
        run: node scripts/prepare-github-pages-output.mjs

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload validation artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: github-pages-preview
          path: .github-pages-site
          if-no-files-found: error
          retention-days: 3

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .github-pages-site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
