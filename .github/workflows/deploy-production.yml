name: Deploy production

on:
  workflow_run:
    workflows: ["Performance and responsive quality gate"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      VITE_MAPBOX_ACCESS_TOKEN: ${{ secrets.VITE_MAPBOX_ACCESS_TOKEN }}
      SITE_URL: ${{ secrets.SITE_URL }}
    steps:
      - name: Check out the validated revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Validate deployment credentials
        shell: bash
        run: |
          required=(
            SUPABASE_ACCESS_TOKEN
            SUPABASE_DB_PASSWORD
            SUPABASE_PROJECT_ID
            CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID
            SUPABASE_URL
            SUPABASE_PUBLISHABLE_KEY
          )
          for name in "${required[@]}"; do
            test -n "${!name}" || { echo "GitHub production secret $name is required" >&2; exit 1; }
          done

      - name: Resolve public Cloudflare URL
        shell: bash
        run: |
          if [ -n "$SITE_URL" ]; then
            resolved_url="${SITE_URL%/}"
          else
            response="$(curl --fail --silent --show-error \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"
            subdomain="$(printf '%s' "$response" | jq -r '.result.subdomain // empty')"
            test -n "$subdomain" || { echo "Unable to resolve the Cloudflare workers.dev subdomain" >&2; exit 1; }
            resolved_url="https://globalparty.${subdomain}.workers.dev"
          fi
          echo "SITE_URL=$resolved_url" >> "$GITHUB_ENV"
          echo "### Cloudflare deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "Public URL: $resolved_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Apply place scraper enrichment source
        run: |
          node --check scripts/apply-place-scraper-enrichment.mjs
          node scripts/apply-place-scraper-enrichment.mjs

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link the production Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Preview pending database migrations
        shell: bash
        run: |
          set -euo pipefail
          standard_log="$(mktemp)"

          if supabase db push --dry-run 2>&1 | tee "$standard_log"; then
            echo "SUPABASE_DB_PUSH_FLAGS=" >> "$GITHUB_ENV"
            exit 0
          fi

          mapfile -t historical_migrations < <(
            grep -oE 'supabase/migrations/[0-9]{14}_[A-Za-z0-9._-]+\.sql' "$standard_log" \
              | sort -u
          )

          if (( ${#historical_migrations[@]} == 0 )); then
            echo "The standard migration preview failed for an unexpected reason." >&2
            exit 1
          fi

          for migration in "${historical_migrations[@]}"; do
            case "$migration" in
              supabase/migrations/20260801161900_prepare_ladecadanse_catalog_compatibility.sql|\
              supabase/migrations/20260801162000_ladecadanse_complete_venue_catalog.sql)
                ;;
              *)
                echo "Refusing --include-all because an unreviewed historical migration is pending: $migration" >&2
                exit 1
                ;;
            esac
          done

          echo "Only reviewed La Décadanse compatibility migrations are out of order."
          supabase db push --dry-run --include-all
          echo "SUPABASE_DB_PUSH_FLAGS=--include-all" >> "$GITHUB_ENV"

      - name: Apply pending database migrations
        shell: bash
        run: |
          if [ "${SUPABASE_DB_PUSH_FLAGS:-}" = "--include-all" ]; then
            supabase db push --include-all
          else
            supabase db push
          fi

      - name: Deploy repository Edge Functions
        run: supabase functions deploy

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply generated discovery and map patches
        run: |
          node --check scripts/apply-progressive-basemap.mjs
          node --check scripts/apply-today-default-fullscreen-intro.mjs
          node --check scripts/apply-map-mobile-performance-and-poi-filters.mjs
          node --check scripts/apply-poi-map-layer.mjs
          node --check scripts/apply-home-place-search.mjs
          node --check scripts/apply-map-consistency-performance.mjs
          node --check scripts/apply-adaptive-map-rendering.mjs
          node scripts/apply-progressive-basemap.mjs
          node scripts/apply-today-default-fullscreen-intro.mjs
          node scripts/apply-map-mobile-performance-and-poi-filters.mjs
          node scripts/apply-poi-map-layer.mjs
          node scripts/apply-home-place-search.mjs
          node scripts/apply-map-consistency-performance.mjs
          node scripts/apply-adaptive-map-rendering.mjs

      - name: Verify generated map runtime
        run: |
          node --test \
            tests/map-basemap-loading.test.ts \
            tests/map-filter-consistency.test.ts \
            tests/map-mobile-performance-poi-filters.test.ts \
            tests/map-adaptive-rendering.test.ts \
            tests/poi-map-layer.test.ts \
            tests/place-discovery.test.ts \
            tests/place-pin-session-cache.test.ts \
            tests/place-map-experience-contract.test.ts \
            tests/place-enrichment-contract.test.ts
          bun run typecheck

      - name: Build Cloudflare Worker bundle
        env:
          NITRO_PRESET: cloudflare_module
        run: bun run build

      - name: Verify Cloudflare build output
        run: |
          test -f .output/server/index.mjs
          test -d .output/public
          test -f .output/public/manifest.webmanifest

      - name: Deploy GlobalParty to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --config wrangler.jsonc
          secrets: |
            SUPABASE_URL
            SUPABASE_PUBLISHABLE_KEY
            SITE_URL
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SITE_URL: ${{ env.SITE_URL }}
