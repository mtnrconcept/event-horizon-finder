name: Deploy production

on:
  workflow_run:
    workflows: ["Performance and responsive quality gate"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      VITE_MAPBOX_ACCESS_TOKEN: ${{ secrets.VITE_MAPBOX_ACCESS_TOKEN }}
      SITE_URL: ${{ secrets.SITE_URL }}
    steps:
      - name: Check out the validated revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Validate deployment credentials
        shell: bash
        run: |
          required=(
            SUPABASE_ACCESS_TOKEN
            SUPABASE_DB_PASSWORD
            SUPABASE_PROJECT_ID
            CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID
            SUPABASE_URL
            SUPABASE_PUBLISHABLE_KEY
            SITE_URL
          )
          for name in "${required[@]}"; do
            test -n "${!name}" || { echo "GitHub production secret $name is required" >&2; exit 1; }
          done

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link the production Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Preview pending database migrations
        run: supabase db push --dry-run

      - name: Apply pending database migrations
        run: supabase db push

      - name: Deploy repository Edge Functions
        run: supabase functions deploy

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply generated map patches
        run: |
          node --check scripts/apply-progressive-basemap.mjs
          node --check scripts/apply-today-default-fullscreen-intro.mjs
          node --check scripts/apply-map-mobile-performance-and-poi-filters.mjs
          node --check scripts/apply-poi-map-layer.mjs
          node scripts/apply-progressive-basemap.mjs
          node scripts/apply-today-default-fullscreen-intro.mjs
          node scripts/apply-map-mobile-performance-and-poi-filters.mjs
          node scripts/apply-poi-map-layer.mjs

      - name: Build Cloudflare Worker bundle
        env:
          NITRO_PRESET: cloudflare_module
        run: bun run build

      - name: Verify Cloudflare build output
        run: |
          test -f .output/server/index.mjs
          test -d .output/public
          test -f .output/public/manifest.webmanifest

      - name: Deploy GlobalParty to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --config wrangler.jsonc
          secrets: |
            SUPABASE_URL
            SUPABASE_PUBLISHABLE_KEY
            SITE_URL
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
