name: Apply La Decadanse event address fix

on:
  push:
    branches:
      - fix/ladecadanse-event-address
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-ladecadanse-event-address-fix
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/ladecadanse-event-address
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply deterministic parser correction
        run: node scripts/apply-ladecadanse-event-address-fix.mjs

      - name: Format and validate scraper
        run: |
          bunx prettier --write \
            supabase/functions/_shared/ladecadanse-adapter.ts
          bunx eslint \
            supabase/functions/_shared/ladecadanse-adapter.ts \
            supabase/functions/_shared/ladecadanse-adapter.test.ts
          node --test supabase/functions/_shared/*.test.ts
          git diff --check

      - name: Commit validated fix
        run: |
          rm scripts/apply-ladecadanse-event-address-fix.mjs
          rm .github/workflows/apply-ladecadanse-event-address-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(scraper): keep schedule metadata out of venue addresses"
          git push origin HEAD:fix/ladecadanse-event-address
