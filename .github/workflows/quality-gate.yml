name: Quality gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      SITE_URL: https://preview.example.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Refresh dependency lockfile
        run: bun install --lockfile-only

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: ESLint
        id: lint
        shell: bash
        run: |
          set +e
          bun run lint 2>&1 | tee eslint.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Production build and route generation
        id: build
        shell: bash
        run: |
          set +e
          bun run build 2>&1 | tee production-build.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: TypeScript
        id: typecheck
        shell: bash
        run: |
          set +e
          bun run typecheck 2>&1 | tee typecheck.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Recovered routes and application shell
        id: routes
        shell: bash
        run: |
          set +e
          bun run check:routes 2>&1 | tee route-check.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: MCP tests
        id: mcp
        shell: bash
        run: |
          set +e
          bun run test:mcp 2>&1 | tee mcp-tests.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate Cloudflare production output
        id: cloudflare_output
        shell: bash
        run: |
          set +e
          test -f .output/server/index.mjs
          code=$?
          if [ "$code" = "0" ]; then
            test -d .output/public
            code=$?
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-diagnostics
          path: |
            typecheck.log
            eslint.log
            mcp-tests.log
            production-build.log
            route-check.log
          if-no-files-found: error
          retention-days: 7

      - name: Upload source snapshot for diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-source-snapshot
          path: |
            src/lib/i18n.tsx
            src/lib/ui-translations.ts
            src/lib/mcp-server.ts
            src/routes/settings.tsx
            src/routes/help.tsx
            src/components/app-footer.tsx
            src/components/client-consent-banner.tsx
            .github/workflows/quality-gate.yml
          if-no-files-found: error
          retention-days: 1

      - name: Enforce quality gate
        if: always()
        shell: bash
        run: |
          echo "Build: ${{ steps.build.outputs.exit_code }}"
          echo "ESLint: ${{ steps.lint.outputs.exit_code }}"
          echo "TypeScript: ${{ steps.typecheck.outputs.exit_code }}"
          echo "Routes: ${{ steps.routes.outputs.exit_code }}"
          echo "MCP tests: ${{ steps.mcp.outputs.exit_code }}"
          echo "Cloudflare output: ${{ steps.cloudflare_output.outputs.exit_code }}"
          test "${{ steps.build.outputs.exit_code }}" = "0"
          test "${{ steps.lint.outputs.exit_code }}" = "0"
          test "${{ steps.typecheck.outputs.exit_code }}" = "0"
          test "${{ steps.routes.outputs.exit_code }}" = "0"
          test "${{ steps.mcp.outputs.exit_code }}" = "0"
          test "${{ steps.cloudflare_output.outputs.exit_code }}" = "0"
